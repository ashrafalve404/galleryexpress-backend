services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gallery-express-api
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DOCKER_CONTAINER: "true"
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-7d}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-90d}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gallery-express-network

  postgres:
    image: postgres:16-alpine
    container_name: gallery-express-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gallery_express
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - galleryexpress_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gallery_express"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gallery-express-network

  redis:
    image: redis:7-alpine
    container_name: gallery-express-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - galleryexpress_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gallery-express-network

volumes:
  galleryexpress_postgres_data:
  galleryexpress_redis_data:

networks:
  gallery-express-network:
    driver: bridge
